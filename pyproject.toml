[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paru-safety-checker"
version = "0.1.0"
description = "Scan AUR PKGBUILDs with AI before installing them with paru"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
paru-safe = "paru_safety_checker.cli:main"

[tool.setuptools]
packages = ["paru_safety_checker", "paru_safety_checker.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
