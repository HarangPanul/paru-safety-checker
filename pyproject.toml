[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paru-safety-checker"
version = "0.1.0"
description = "Help you understand what an AUR PKGBUILD is made of and does before installing it with paru"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "HarangPanul" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
paru-safe = "paru_safety_checker.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]
packages = ["paru_safety_checker", "paru_safety_checker.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
